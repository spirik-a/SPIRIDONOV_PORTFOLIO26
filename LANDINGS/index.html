<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Landing Pages Portfolio</title>
    <!-- Шрифт Orbitron для заголовків -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background-color: #ffffff;
        font-family: "Inter", sans-serif;
        color: #000000;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        overflow-x: hidden;
        position: relative;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
      }

      input,
      textarea,
      select {
        -webkit-user-select: text;
        -moz-user-select: text;
        -ms-user-select: text;
        user-select: text;
      }

      /* Фонове зображення BG.png */
      .bg-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 0;
        pointer-events: none;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .bg-container img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .main-wrapper {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 1200px;
        padding: 60px 20px 100px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      /* Головна шапка */
      .page-title {
        font-family: "Orbitron", sans-serif;
        font-size: 3rem;
        font-weight: 900;
        letter-spacing: 2px;
        text-transform: uppercase;
        text-align: center;
        margin-bottom: 70px;
        color: #000000;
      }

      /* Сітка категорій */
      .categories-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 60px;
        width: 100%;
      }

      @media (max-width: 900px) {
        .categories-grid {
          grid-template-columns: 1fr;
          gap: 50px;
        }
      }

      .category-column {
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .category-title {
        font-family: "Orbitron", sans-serif;
        font-size: 1.4rem;
        font-weight: 800;
        letter-spacing: 1px;
        text-transform: uppercase;
        margin-bottom: 30px;
        text-align: center;
        color: #000000;
      }

      .cards-row {
        display: flex;
        gap: 24px;
        justify-content: center;
        width: 100%;
      }

      /* Картка проекту */
      .project-card {
        width: 220px;
        height: 480px;
        border-radius: 12px;
        overflow: hidden;
        background: #0d1117;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.15);
        position: relative;
        text-decoration: none;
        display: block;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
      }

      .project-card:hover {
        transform: translateY(-6px);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
      }

      /* Контейнер зображення з автоскролом */
      .card-image-wrapper {
        width: 100%;
        height: 100%;
        overflow: hidden;
        position: relative;
      }

      .card-image-wrapper img {
        width: 100%;
        height: auto;
        display: block;
        position: absolute;
        top: 0;
        left: 0;
        transition: transform 4s linear;
        will-change: transform;
      }

      .project-card:hover .card-image-wrapper img {
        transform: translateY(calc(-100% + 480px));
      }

      /* Оверлей при наведенні */
      .card-overlay {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        padding: 16px;
        background: linear-gradient(
          to top,
          rgba(0, 0, 0, 0.85) 0%,
          rgba(0, 0, 0, 0) 100%
        );
        opacity: 0;
        transition: opacity 0.3s ease;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        height: 100px;
        pointer-events: none;
      }

      .project-card:hover .card-overlay {
        opacity: 1;
      }

      .view-btn {
        background: #ffffff;
        color: #000000;
        font-weight: 600;
        font-size: 0.85rem;
        padding: 8px 16px;
        border-radius: 20px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      }
    </style>
  </head>
  <body>
    <!-- Зображення фону BG.png -->
    <div class="bg-container">
      <img src="BG.png" alt="Background Glow" />
    </div>

    <main class="main-wrapper">
      <h1 class="page-title">LANDING PAGES</h1>

      <div class="categories-grid">
        <!-- СЕКЦІЯ IT PROJECTS -->
        <section class="category-column">
          <h2 class="category-title">IT PROJECTS</h2>
          <div class="cards-row">
            <!-- Проект 1: CyberShield V1 -->
            <a
              href="https://spirik-a.github.io/cybercecurity_product_lp1/"
              target="_blank"
              class="project-card"
            >
              <div class="card-image-wrapper">
                <img src="ciberSHIELD1_1.png" alt="CyberShield Project 1" />
              </div>
              <div class="card-overlay">
                <span class="view-btn">Переглянути</span>
              </div>
            </a>

            <!-- Проект 2: CyberShield V2 -->
            <a
              href="https://spirik-a.github.io/cybercecurity_product_lp2/"
              target="_blank"
              class="project-card"
            >
              <div class="card-image-wrapper">
                <img src="ciberSHIELD2_1.png" alt="CyberShield Project 2" />
              </div>
              <div class="card-overlay">
                <span class="view-btn">Переглянути</span>
              </div>
            </a>
          </div>
        </section>

        <!-- СЕКЦІЯ FINANCIAL PROJECTS -->
        <section class="category-column">
          <h2 class="category-title">FINANCIAL PROJECTS</h2>
          <div class="cards-row">
            <!-- Проект 3: EasyPay -->
            <a
              href="https://spirik-a.github.io/EASYPAY/"
              target="_blank"
              class="project-card"
            >
              <div class="card-image-wrapper">
                <img src="EASYPAY1.png" alt="EasyPay Project" />
              </div>
              <div class="card-overlay">
                <span class="view-btn">Переглянути</span>
              </div>
            </a>

            <!-- Проект 4: Kasa -->
            <a
              href="https://spirik-a.github.io/MY_KASA/"
              target="_blank"
              class="project-card"
            >
              <div class="card-image-wrapper">
                <img src="KASA1.png" alt="Kasa Project" />
              </div>
              <div class="card-overlay">
                <span class="view-btn">Переглянути</span>
              </div>
            </a>
          </div>
        </section>
      </div>
    </main>

    <!-- Скрипт захисту коду -->
    <script>
      /* Захист від контекстного меню, виділення та комбінацій клавіш */
      document.addEventListener("contextmenu", (e) => e.preventDefault());

      document.addEventListener(
        "keydown",
        (e) => {
          const key = e.key.toLowerCase();
          const code = e.code;

          if (key === "f12" || code === "F12") {
            e.preventDefault();
            e.stopPropagation();
            return false;
          }

          if (e.ctrlKey || e.metaKey) {
            if (
              key === "u" ||
              code === "KeyU" ||
              key === "s" ||
              code === "KeyS" ||
              key === "a" ||
              code === "KeyA"
            ) {
              e.preventDefault();
              e.stopPropagation();
              return false;
            }

            if (
              e.shiftKey &&
              (key === "i" ||
                code === "KeyI" ||
                key === "j" ||
                code === "KeyJ" ||
                key === "c" ||
                code === "KeyC")
            ) {
              e.preventDefault();
              e.stopPropagation();
              return false;
            }
          }
        },
        true
      );

      document.addEventListener("copy", (e) => e.preventDefault());
      document.addEventListener("cut", (e) => e.preventDefault());
      document.addEventListener("selectstart", (e) => {
        if (
          e.target.tagName !== "INPUT" &&
          e.target.tagName !== "TEXTAREA" &&
          e.target.tagName !== "SELECT"
        ) {
          e.preventDefault();
        }
      });
    </script>
  </body>
</html>
